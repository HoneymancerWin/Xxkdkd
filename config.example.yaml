# Скопируйте в config.yaml и заполните.

telegram:
  token: "123456:ABC..."     # от @BotFather (или переменная TELEGRAM_TOKEN)
  chat_ids: [123456789]      # ваш id — узнать у @userinfobot (или TELEGRAM_CHAT_ID)
  # proxy: "socks5://user:pass@host:1080"   # если Telegram недоступен

# proxy: "http://user:pass@host:port"   # прокси для Авито (сильно снижает риск блокировки)
interval: 180            # секунд между проходами (не ставьте меньше ~60)
db: avito_monitor.db

# Значения по умолчанию для всех поисков (каждый поиск может переопределить)
defaults:
  pages: 2               # страниц выдачи на поиск
  discount: 25           # объявление дешевле рынка на 25%+ → уведомление
  min_samples: 15        # пока цен в истории меньше — рынок не считается
  history_days: 14
  notify_price_drops: true     # писать, если старое объявление подешевело до выгодной цены
  notify_on_first_run: false   # при первом запуске только запомнить текущие объявления

  # Анализ объявления (открывается только для тех, что прошли по цене)
  details: true                # описание, характеристики, состояние, продавец
  min_seller_rating: 4.5       # рейтинг продавца не ниже (продавцы без отзывов этим не отсеиваются)
  min_seller_reviews: 3        # минимум отзывов у продавца (0 — пропускать новичков)
  # conditions: ["Новое", "Б/у"]        # допустимые состояния; пусто = любые
  # seller_types: ["Частное лицо"]      # только частники / только компании
  reject_red_flags: ["iCloud", "заблокирован", "на запчасти", "копия", "реплика", "в залоге"]
  min_score: 4                 # оценка сделки 0–10; ниже — не присылать

searches:
  # URL — это просто страница поиска Авито с нужными фильтрами.
  # Добавьте s=104, чтобы выдача была отсортирована по дате (новые сверху).
  - name: "iPhone 13 128GB, Москва"
    url: "https://www.avito.ru/moskva/telefony/mobilnye_telefony/apple-ASgBAgICAkS0wA3OqzmwwQ2I_Dc?q=iphone+13+128&s=104"
    market_price: 20000   # рынок за хорошее состояние; уберите — бот посчитает сам по выдаче
    discount: 20          # → уведомление от 16 000 ₽ и дешевле
    min_price: 9000       # дешевле — почти наверняка мусор/скам
    condition_grade: excellent   # только б/у в отличном/идеальном состоянии
    allow_new: false
    allow_unknown_condition: false   # true — присылать и те, где состояние не описано (с пометкой)
    min_battery: 85              # АКБ не ниже 85% (если продавец указал)
    include: ["128"]
    exclude: ["разбит", "icloud", "запчаст", "копия", "реплика", "на запчасти"]

  - name: "PS5 до 35к"
    url: "https://www.avito.ru/moskva?q=playstation+5&s=104"
    max_price: 35000      # просто ценовой порог, без сравнения с рынком
    discount: null
    min_price: 15000
    exclude: ["аренда", "геймпад", "диск", "игра"]
